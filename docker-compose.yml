services:
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: services/catalog/catalog.API/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - CatalogDb
    extra_hosts:
      - "host.docker.internal:host-gateway"    
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ENV ASPNETCORE_URLS=http://+:8000
      - DatabaseSettings__ConnectionString=mongodb://CatalogDb:27017
      - DatabaseSettings__DatabaseName=CatalogDb
      - DatabaseSettings__ProductsCollection=Products
      - DatabaseSettings__BrandsCollection=Brands
      - DatabaseSettings__TypesCollection=Types
      - "ElasticConfiguration__Uri=http://elasticsearch:9200" 
      - Auth_Authority="http://host.docker.internal:9009"
      - Auth__RequireHttpsMetadata=false
      - Auth__Audience=Catalog 

  CatalogDb:
    image: mongo:4.4.2-bionic
    container_name: CatalogDb
    ports:
      - "27017:27017"
    volumes:
      - catalogdbdata:/data/db

  
  basketdb:
    image: redis:alpine
    container_name: basketdb
    restart: always
    ports:
      - "6379:6379"
  discountdb:
    image: postgres:15
    container_name: discountdb
    environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: Password@1
        POSTGRES_DB: discountdb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U admin -d discountdb -h localhost"]
        interval: 10s
        timeout: 5s
        retries: 5 
   
  orderingdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orderingdb
    environment:
        ACCEPT_EULA: "Y"
        SA_PASSWORD: p@ssw0rd123
    restart: always
    ports:
      - "1433:1433"
    volumes:
      - orderingdbdata:/var/opt/mssql
    healthcheck:
        test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'p@ssw0rd123' -Q 'SELECT 1' || exit 1"]
        interval: 10s
        timeout: 10s
        retries: 15
        start_period: 40s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
   

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
        - PGADMIN_DEFAULT_EMAIL=admin@ecomerece.com
        - PGADMIN_DEFAULT_PASSWORD=Password@1
    restart: always
    ports:
        - "5050:80"
    volumes:
        - pgadmin_data:/var/lib/pgadmin
      

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: services/basket/basket.API/Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      - basketdb
      - rabbitmq 
    environment:
      - ASPNETCORE_URLS=http://+:8000
      - CacheSettings__ConnectionString=basketdb:6379
      - "GrpcSettings__DiscountUrl=http://discount.api:8080"
      - EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672 
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"  
      
  discount.api:
    image: ${DOCKER_REGISTRY-}discountapi
    build:
        context: .
        dockerfile: services/discount/discount.API/Dockerfile
    container_name: discount.api
    depends_on:
        discountdb:
            condition: service_healthy
    ports:
        - "8002:8000"
    environment:
        - DatabaseSettings__ConnectionString=Host=discountdb;Port=5432;Database=discountdb;Username=admin;Password=Password@1
        - "ElasticConfiguration__Uri=http://elasticsearch:9200" 
  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    build:
      context: .
      dockerfile: services/ordering/ordering.API/Dockerfile
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_URLS=http://+:8080
        - ConnectionStrings__OrderingConnectionString=Server=orderingdb;Database=OrderDb;User Id=sa;Password=p@ssw0rd123;TrustServerCertificate=True
        - EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672 
        - "ElasticConfiguration__Uri=http://elasticsearch:9200"  
    depends_on:
         orderingdb:
            condition: service_healthy
         rabbitmq:
            condition: service_started 
        
    ports:
        - "8003:8080" 


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false 
    ports:
      - "9200:9200"
      - "9300:9300" 
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data 

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200  
    ports:
      - "5601:5601" 
    depends_on:
      - elasticsearch
  
  ocelot.apigateway:
    image: ${DOCKER_REGISTRY-}ocelotapigateway
    build:
      context: .
      dockerfile: APIGateWay/Ocelot.APIGateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - catalog.api
      - basket.api
      - discount.api
      - ordering.api
    ports:
      - "8010:8080"

volumes:
  catalogdbdata:
  postgresdata:
  pgadmin_data:
  orderingdbdata:
  elasticsearchdata:


